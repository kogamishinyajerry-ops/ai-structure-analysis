<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI-FEA · Workflow Monitor (Mock pipeline)</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1e2a38;
    --ink:#e6edf3; --muted:#8b9bb0; --dim:#5d6b7e;
    --accent:#4ea1ff; --good:#3ad29f; --warn:#ffb454; --bad:#ff6b6b; --run:#4ea1ff;
    --grid:#16202c;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 70% -10%,#13202e 0%,var(--bg) 55%);
       color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5}
  .wrap{max-width:1340px;margin:0 auto;padding:16px 18px 50px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
  .logo{font-weight:700;font-size:15px}.logo b{color:var(--accent)}
  .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  input,select,button{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--panel);
        border:1px solid var(--line);border-radius:7px;padding:6px 10px}
  input{font-family:var(--mono);width:230px}
  button{cursor:pointer;transition:.15s}button:hover{border-color:var(--accent)}
  button.primary{background:#143049;border-color:#27557e;color:#cfe6ff;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  .badge{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
  .controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .grid{display:grid;grid-template-columns:300px 1fr 320px;gap:13px}
  @media(max-width:1080px){.grid{grid-template-columns:1fr}}
  .col{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:12px}
  .col h3{margin:0 0 10px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
  /* node graph */
  .node{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent;position:relative}
  .node:hover{background:#0f1a26}
  .node.sel{border-color:#2c4156;background:#101b29}
  .node .rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;padding-top:2px}
  .node .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--dim);background:transparent}
  .node .stem{width:2px;flex:1;background:var(--grid);min-height:8px;margin:2px 0}
  .node:last-child .stem{display:none}
  .node .body{flex:1;min-width:0}
  .node .nm{font-size:12.5px;font-weight:600}
  .node .meta{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  .node .pbar{height:3px;background:var(--grid);border-radius:2px;margin-top:4px;overflow:hidden}
  .node .pbar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  /* status colors */
  .s-pending .dot{border-color:var(--dim)}
  .s-running .dot{border-color:var(--run);background:var(--run);animation:pulse 1s infinite}
  .s-success .dot{border-color:var(--good);background:var(--good)}
  .s-warning .dot{border-color:var(--warn);background:var(--warn)}
  .s-failed  .dot{border-color:var(--bad);background:var(--bad)}
  .s-running .nm{color:var(--run)} .s-warning .nm{color:var(--warn)} .s-failed .nm{color:var(--bad)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,161,255,.5)}50%{box-shadow:0 0 0 5px rgba(78,161,255,0)}}
  .chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
  .chip.warn{color:var(--warn);border-color:#5a431f} .chip.bad{color:var(--bad);border-color:#5a2b2b} .chip.ok{color:var(--good);border-color:#1f4d3e}
  /* center */
  .viz{background:#0a0f15;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .detail{margin-top:11px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--grid);font-size:12.5px}
  .kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-family:var(--mono)}
  /* agent log */
  .log{display:flex;flex-direction:column;gap:9px;max-height:560px;overflow:auto}
  .entry{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel)}
  .entry .top{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .entry .why{margin:5px 0 0;font-size:12.5px}
  .entry .next{margin-top:6px;font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
  .entry.warn{border-color:#5a431f}.entry.failed{border-color:#5a2b2b}
  .ic{width:8px;height:8px;border-radius:50%;display:inline-block}
  .ic.run{background:var(--run)}.ic.ok{background:var(--good)}.ic.warn{background:var(--warn)}.ic.bad{background:var(--bad)}
  /* bottom */
  .bottom{margin-top:13px;display:grid;grid-template-columns:1.4fr 1fr;gap:13px}
  @media(max-width:1080px){.bottom{grid-template-columns:1fr}}
  .timeline{display:flex;gap:4px;flex-wrap:wrap}
  .tl{font-family:var(--mono);font-size:9.5px;padding:3px 5px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
  .tl.s-success{color:var(--good);border-color:#1f4d3e}.tl.s-warning{color:var(--warn);border-color:#5a431f}
  .tl.s-failed{color:var(--bad);border-color:#5a2b2b}.tl.s-running{color:var(--run);border-color:#27557e}
  .listitem{font-size:12px;padding:5px 8px;border-radius:7px;background:var(--panel);margin-bottom:5px;border-left:2px solid var(--line)}
  .listitem.warn{border-color:var(--warn)}.listitem.bad{border-color:var(--bad)}
  a.dl{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:12px}
  .empty{color:var(--dim);font-size:12px;font-style:italic}
  .slabel{font-size:10px;fill:var(--muted);font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo"><b>AI-FEA</b> · Workflow Monitor <span class="sub">— Mock pipeline (synthetic solver data · real StageState events)</span></div>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="run-badge">no run</span>
  </header>

  <div class="controls">
    <span class="sub">API base</span>
    <input id="api" value="http://localhost:8077/api/v1"/>
    <button class="primary" id="run">▶ Run pipeline</button>
    <span class="sub">fail at</span>
    <select id="failat"><option value="">— none —</option></select>
    <button id="reset">Reset</button>
    <span class="spacer"></span>
    <span class="sub" id="conn">·</span>
  </div>

  <div class="grid">
    <div class="col">
      <h3>FEA Workflow · 13 stages</h3>
      <div id="nodes"></div>
    </div>
    <div class="col">
      <h3 id="viz-title">Preview</h3>
      <div class="viz" id="viz"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="col">
      <h3>Agent 解释日志</h3>
      <div class="log" id="log"><div class="empty">运行后，每个阶段的「在做什么 / 为什么 / 建议」会在此累积。</div></div>
    </div>
  </div>

  <div class="bottom">
    <div class="col">
      <h3>运行时间线</h3>
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="col">
      <h3>警告 · 错误 · 产物</h3>
      <div id="wea"><div class="empty">无</div></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
if(qs.get('api')) $('#api').value = qs.get('api');
const api = () => $('#api').value.replace(/\/$/,'');

let STAGES = [];          // [{order,stage,wsStage,currentObject,description}]
let stageIndex = {};      // stage -> order
let run = null;           // latest run JSON
let selected = null;      // selected stage id (for the viz/detail)
let pollTimer = null;
const seenLog = new Set();

const STATUS_IC = {running:'run',success:'ok',warning:'warn',failed:'bad',pending:''};

async function loadStages(){
  try{
    const r = await fetch(api()+'/workflow/stages'); const d = await r.json();
    STAGES = d.stages; stageIndex = {}; STAGES.forEach(s=>stageIndex[s.stage]=s.order);
    const sel = $('#failat'); sel.innerHTML = '<option value="">— none —</option>' +
      STAGES.map(s=>`<option value="${s.stage}">${s.order+1}. ${s.description}</option>`).join('');
    $('#conn').textContent = '● connected · '+STAGES.length+' stages';
    $('#conn').style.color = 'var(--good)';
    renderNodes(); renderViz();
  }catch(e){
    $('#conn').textContent = '○ 后端未连接 — 先运行 python scripts/serve_workflow_demo.py';
    $('#conn').style.color = 'var(--bad)';
  }
}

function stState(stage){ return run ? run.stages.find(s=>s.stage===stage) : null; }

function renderNodes(){
  $('#nodes').innerHTML = STAGES.map(s=>{
    const st = stState(s.stage); const status = st?st.status:'pending';
    const prog = st?Math.round((st.progress||0)*100):0;
    const obj = st?st.currentObject:s.currentObject;
    const isSel = selected===s.stage;
    return `<div class="node s-${status} ${isSel?'sel':''}" data-stage="${s.stage}">
      <div class="rail"><div class="dot"></div><div class="stem"></div></div>
      <div class="body">
        <div class="nm">${s.order+1}. ${s.description}</div>
        <div class="meta">${obj||''} ${st&&st.status!=='pending'?'· '+status:''}</div>
        <div class="pbar"><i style="width:${status==='pending'?0:prog}%"></i></div>
      </div></div>`;
  }).join('');
  $('#nodes').querySelectorAll('.node').forEach(n=>n.onclick=()=>{selected=n.dataset.stage;renderNodes();renderViz();});
}

// ---- center viz: a bracket-with-hole specimen, layered by active stage ----
function activeIdx(){
  if(selected!=null) return stageIndex[selected];
  if(run&&run.currentStage!=null) return stageIndex[run.currentStage];
  // last done
  if(run){let last=-1; run.stages.forEach(s=>{if(s.status!=='pending')last=Math.max(last,stageIndex[s.stage]);}); return last;}
  return -1;
}
function renderViz(){
  const idx = activeIdx();
  const has = name => idx >= stageIndex[name];
  const at = name => (selected===name) || (run&&run.currentStage===name);
  const W=520,H=300;
  // bracket plate with a hole
  const plate = `M40 60 H440 a30 30 0 0 1 30 30 V210 a30 30 0 0 1 -30 30 H40 a30 30 0 0 1 -30 -30 V90 a30 30 0 0 1 30 -30 Z`;
  const hole = {cx:330,cy:150,r:46};
  let layers = '';
  // stress fill (solver onward)
  if(has('solver_run')){
    layers += `<defs><radialGradient id="stress" cx="${(hole.cx)/W}" cy="${hole.cy/H}" r="0.6">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset="0.4" stop-color="#ffb454"/>
      <stop offset="0.75" stop-color="#3ad29f"/><stop offset="1" stop-color="#2b6cb0"/></radialGradient></defs>
      <path d="${plate}" fill="url(#stress)" opacity="0.85"/>`;
  } else {
    layers += `<path d="${plate}" fill="#13212f" stroke="#2c4156"/>`;
  }
  // mesh overlay (mesh_generation onward)
  if(has('mesh_generation')){
    let m='';
    for(let x=40;x<=440;x+=26) m+=`<line x1="${x}" y1="60" x2="${x}" y2="240" stroke="#2c4156" stroke-width="0.5" opacity="0.5"/>`;
    for(let y=60;y<=240;y+=24) m+=`<line x1="10" y1="${y}" x2="470" y2="${y}" stroke="#2c4156" stroke-width="0.5" opacity="0.5"/>`;
    layers += `<g>${m}</g>`;
  }
  // hole
  layers += `<circle cx="${hole.cx}" cy="${hole.cy}" r="${hole.r}" fill="#0a0f15" stroke="#3a4d60"/>`;
  // bad mesh ring at hole (mesh_quality)
  if(has('mesh_quality_check')){
    layers += `<circle cx="${hole.cx}" cy="${hole.cy}" r="${hole.r+9}" fill="none" stroke="#ffb454" stroke-width="2.5" stroke-dasharray="5 4" opacity="${at('mesh_quality_check')?1:0.5}"/>
      <text x="${hole.cx}" y="${hole.cy-hole.r-16}" text-anchor="middle" class="slabel" fill="#ffb454">bracket_hole_region</text>`;
  }
  // BC fixed edge (left)
  if(has('boundary_conditions')){
    let h=''; for(let y=66;y<=234;y+=12) h+=`<line x1="10" y1="${y}" x2="22" y2="${y+8}" stroke="#5d9bff" stroke-width="1.4"/>`;
    layers += `<g>${h}</g><text x="8" y="54" class="slabel" fill="#5d9bff">fixed</text>`;
  }
  // load arrows (top)
  if(has('load_cases')){
    let a=''; for(let x=120;x<=400;x+=60) a+=`<line x1="${x}" y1="30" x2="${x}" y2="56" stroke="#3ad29f" stroke-width="1.6" marker-end="url(#ah)"/>`;
    layers += `<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="3" refY="6" orient="auto"><path d="M0 0 L3 6 L6 0" fill="#3ad29f"/></marker></defs><g>${a}</g><text x="60" y="26" class="slabel" fill="#3ad29f">5 kN</text>`;
  }
  // deformation (result) — exaggerated dashed outline
  if(has('result_analysis')){
    layers += `<path d="M40 64 H444 a30 30 0 0 1 30 30 V214 a30 30 0 0 1 -30 30 H40" fill="none" stroke="#fff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>`;
  }
  const titleStage = STAGES[idx];
  $('#viz-title').textContent = 'Preview' + (titleStage?(' · '+titleStage.description):'');
  $('#viz').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${layers}
    ${has('solver_run')?`<text x="40" y="280" class="slabel">von Mises (peak at hole edge)</text>`:''}</svg>`;
  renderDetail(idx);
}
function fmt(v){ if(typeof v==='number'){ if(Math.abs(v)>=1e6||(v!==0&&Math.abs(v)<1e-3)) return v.toExponential(3); return v; } return v; }
function renderDetail(idx){
  const s = STAGES[idx]; const st = s?stState(s.stage):null;
  if(!st){ $('#detail').innerHTML = '<div class="empty">点击左侧节点或运行流水线查看阶段详情。</div>'; return; }
  const m = st.metrics||{};
  const rows = Object.keys(m).filter(k=>m[k]!=null&&k!=='schemaVersion').map(k=>`<div class="kv"><span class="k">${k}</span><span class="v">${fmt(m[k])}</span></div>`).join('');
  $('#detail').innerHTML = `<div class="kv"><span class="k">stage</span><span class="v">${st.stage} <span class="chip ${st.status==='warning'?'warn':st.status==='failed'?'bad':'ok'}">${st.status}</span></span></div>
    <div class="kv"><span class="k">currentObject</span><span class="v">${st.currentObject||'—'}</span></div>
    ${rows||''}`;
}

function renderLog(){
  if(!run) return;
  run.stages.forEach(st=>{
    if(st.status==='pending') return;
    const key = st.stage+':'+st.status;
    if(seenLog.has(key)) return;
    // only log running-start + terminal
    if(!['running','success','warning','failed'].includes(st.status)) return;
    seenLog.add(key);
    const cls = st.status==='warning'?'warn':st.status==='failed'?'failed':'';
    const ic = STATUS_IC[st.status]||'run';
    const desc = STAGES.find(s=>s.stage===st.stage);
    const warn = (st.warnings||[]).map(w=>`<div class="next" style="border-color:var(--warn);color:var(--warn)">⚠ ${w}</div>`).join('');
    const err = (st.errors||[]).map(e=>`<div class="next" style="border-color:var(--bad);color:var(--bad)">✗ ${e.faultClass}: ${e.message}</div>`).join('');
    const e = document.createElement('div');
    e.className = 'entry '+cls;
    e.innerHTML = `<div class="top"><span class="ic ${ic}"></span>${(desc?desc.order+1+'. ':'')}${st.description} · ${st.status}</div>
      ${st.agentExplanation?`<div class="why">${st.agentExplanation}</div>`:''}
      ${warn}${err}
      ${st.nextAction?`<div class="next">→ ${st.nextAction}</div>`:''}`;
    const log = $('#log'); if(log.querySelector('.empty')) log.innerHTML='';
    log.appendChild(e); log.scrollTop = log.scrollHeight;
  });
}

function renderTimeline(){
  $('#timeline').innerHTML = STAGES.map(s=>{
    const st = stState(s.stage); const status = st?st.status:'pending';
    return `<span class="tl s-${status}" title="${s.description}">${s.order+1} ${s.stage.split('_')[0]}</span>`;
  }).join('');
}
function renderWEA(){
  if(!run){ $('#wea').innerHTML='<div class="empty">无</div>'; return; }
  let html='';
  run.stages.forEach(st=>{
    (st.warnings||[]).forEach(w=>html+=`<div class="listitem warn">⚠ <b>${st.stage}</b> · ${w}</div>`);
    (st.errors||[]).forEach(e=>html+=`<div class="listitem bad">✗ <b>${st.stage}</b> · ${e.faultClass}: ${e.message}</div>`);
    const rf = st.artifacts&&st.artifacts.reportFile;
    if(rf) html+=`<div class="listitem">📄 report · <a class="dl" href="#">${rf}</a></div>`;
  });
  $('#wea').innerHTML = html || '<div class="empty">无警告 / 错误 / 产物</div>';
}

function renderAll(){ renderNodes(); renderViz(); renderTimeline(); renderLog(); renderWEA(); updateBadge(); }
function updateBadge(){
  const b=$('#run-badge'); if(!run){b.textContent='no run';return;}
  const map={running:['running','var(--run)'],success:['SUCCESS','var(--good)'],warning:['WARNING','var(--warn)'],failed:['FAILED','var(--bad)'],pending:['pending','var(--muted)']};
  const [t,c]=map[run.status]||['?','var(--muted)']; b.textContent=run.runId+' · '+t; b.style.color=c;
}

async function poll(runId){
  try{
    const r = await fetch(api()+'/workflow/runs/'+runId); run = await r.json();
  }catch(e){ return; }
  renderAll();
  if(['success','warning','failed'].includes(run.status)){ clearInterval(pollTimer); pollTimer=null; $('#run').disabled=false; }
}

async function start(sync){
  const failAt = $('#failat').value || null;
  seenLog.clear(); $('#log').innerHTML=''; selected=null; run=null;
  $('#run').disabled=true;
  const body = JSON.stringify({label:'monitor', failAtStage:failAt});
  const url = api()+'/workflow/trigger'+(sync?'?sync=true':'');
  const r = await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body});
  run = await r.json(); renderAll();
  if(sync){ $('#run').disabled=false; return; }
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>poll(run.runId), 500);
}

$('#run').onclick=()=>start(false);
$('#reset').onclick=()=>{run=null;selected=null;seenLog.clear();$('#log').innerHTML='<div class="empty">已重置。</div>';renderAll();};
$('#api').onchange=loadStages;

(async ()=>{
  await loadStages();
  const auto = qs.get('autorun');           // ?autorun=happy | ?autorun=<stage> (sync, for screenshots)
  if(auto){ if(auto!=='happy') $('#failat').value=auto; await start(true); }
})();
</script>
</body>
</html>
